name: Build WolFox GPS Ultimate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=~/theos" >> $GITHUB_ENV
          echo "~/theos/bin" >> $GITHUB_PATH

      - name: Setup iOS SDK
        run: |
          mkdir -p ~/theos/sdks
          curl -L https://github.com/theos/sdks/raw/master/iPhoneOS14.5.sdk.tar.xz | tar -xJf - -C ~/theos/sdks
          # تأكد من أن Makefile يستخدم نفس نسخة الـ SDK أو إصداراً عاماً
          sed -i '' 's/iphone:clang:latest:14.0/iphone:clang:14.5:14.0/g' Makefile || true

      - name: Build Package
        run: |
          export THEOS=~/theos
          make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: WolFox-GPS-Ultimate-DEB
          path: packages/*.deb
