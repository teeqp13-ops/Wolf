name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        brew install ldid xz

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $GITHUB_WORKSPACE/theos
        echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

    - name: Download iOS SDK
      run: |
        if [ ! -d "$GITHUB_WORKSPACE/theos/sdks" ]; then
          git clone https://github.com/theos/sdks.git "$GITHUB_WORKSPACE/theos/sdks"
        fi

    - name: Build Package
      run: |
        export THEOS=$GITHUB_WORKSPACE/theos
        cd $GITHUB_WORKSPACE
        make package FINALPACKAGE=1

    - name: Get Package Name
      id: package
      run: |
        PACKAGE_FILE=$(ls -t packages/*.deb | head -n1)
        echo "package_file=$PACKAGE_FILE" >> $GITHUB_OUTPUT
        echo "package_name=$(basename $PACKAGE_FILE)" >> $GITHUB_OUTPUT

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.package.outputs.package_file }}
        asset_name: ${{ steps.package.outputs.package_name }}
        asset_content_type: application/vnd.debian.binary-package
